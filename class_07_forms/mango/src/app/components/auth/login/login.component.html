<div class="container auth-container">
  <mat-card appearance="outlined">
    <mat-card-content class="card-content-padded">
      <div class="auth-header">
        <mat-icon>spa</mat-icon>
        <h1 class="auth-title">Sign In</h1>
        <p class="auth-subtitle">Welcomer back to Mango</p>
      </div>

      <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" novalidate>
        <mat-form-field appearance="outline" class="full-width-field">
          <mat-label>Email address</mat-label>
          <mat-icon matPrefix>email</mat-icon>
          <input
            type="email"
            matInput
            name="email"
            [(ngModel)]="model.email"
            #emailCtrl="ngModel"
            required
            email
          />
          @if (emailCtrl.invalid && emailCtrl.touched) {
            <mat-error>Email is required in valid format</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width-field">
          <mat-label>Password</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input
            type="password"
            matInput
            name="password"
            [(ngModel)]="model.password"
            #passwordCtrl="ngModel"
            required
          />
          @if (passwordCtrl.invalid && passwordCtrl.touched) {
            <mat-error>Password is required (Min. 8 chars)</mat-error>
          }
        </mat-form-field>

        <button
          class="submit-button"
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="loginForm.invalid"
        >
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account?
        <a routerLink="/register">Register</a>
      </div>
    </mat-card-content>
  </mat-card>
</div>
