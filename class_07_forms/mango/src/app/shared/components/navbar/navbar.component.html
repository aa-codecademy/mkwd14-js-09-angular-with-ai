<mat-toolbar color="primary" class="navbar-toolbar">
  <div class="navbar-row">
    <mat-icon>spa</mat-icon>
    <a routerLink="/" class="navbar-brand">Mango</a>
    <div style="display: flex; gap: 5px; margin-left: 5px">
      <a
        routerLink="/"
        mat-button
        class="navbar-link"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: true }"
        >Home</a
      >
      <a mat-button routerLink="/products" class="navbar-link" routerLinkActive="active-link"
        >Products ({{ productCount }})</a
      >
      <a mat-button class="navbar-link" routerLink="/admin">Admin</a>
      <a mat-button class="navbar-link" routerLink="/login">Login</a>
    </div>
    <!-- An empty span used purely for flexbox spacing (pushes the search box and cart to the right) -->
    <!-- a common Material toolbar trick, styled via the "spacer" class in navbar.component.css. -->
    <span class="spacer"></span>
    <!-- matBadge overlays a small counter badge on the button - handy for cart item counts, notifications, etc. -->
    <a routerLink="/cart">
      <button
        mat-icon-button
        [matBadge]="cartService.itemsCount()"
        matBadgeColor="accent"
        aria-label="Cart"
      >
        <mat-icon>shopping_cart</mat-icon>
      </button>
    </a>
  </div>
  @if (loadingService.isLoading()) {
    <mat-progress-bar mode="indeterminate" class="navbar-progress" />
  }
</mat-toolbar>
