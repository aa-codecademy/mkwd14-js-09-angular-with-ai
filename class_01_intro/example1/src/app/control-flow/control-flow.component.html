<h2>Product list</h2>
<!--
  @if / @else is the modern Angular control-flow block syntax (replaces the
  *ngIf structural directive). No import required, and it reads top-to-bottom
  like plain JS if/else — easier to follow than the directive syntax.
-->
@if (!products.length) {
  <p>No products found.</p>
} @else {
  <ul>
    <!--
      @for REQUIRES `track` — it tells Angular how to identify each item across
      re-renders so it can reuse/reorder existing DOM nodes instead of
      destroying and recreating them. Always track by a stable unique id, never
      the array index, or you'll get subtle bugs when the list reorders.
    -->
    @for (product of products; track product.id) {
      <!-- [class.x]="cond" toggles a single CSS class based on a boolean expression -->
      <li [class.out-of-stock]="!product.inStock">
        <!-- The `currency` pipe formats the raw number as localized currency (e.g. $999.00) -->
        {{ product.name }} - {{ product.price | currency }}
        @if (!product.inStock) {
          <span>(Out of stock)</span>
        }
      </li>
    }
  </ul>
}
