<div class="container not-found-page">
  <mat-icon class="not-found-icon">sentiment_dissatisfied</mat-icon>
  <h1 class="not-found-code">404</h1>
  <h2 class="not-found-subtitle">{{ 'product.notFoundTitle' | translate }}</h2>
  <p class="not-found-text">
    {{ 'product.notFoundText' | translate: { id: productId() } }}
  </p>
  <a mat-flat-button color="primary" routerLink="/products">{{
    'product.backToProducts' | translate
  }}</a>
</div>
