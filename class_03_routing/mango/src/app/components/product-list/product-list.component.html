<div>
  <div>
    <h1>All Products</h1>
  </div>

  <div>
    <!-- @for is the new control-flow syntax replacing *ngFor - `track product.id` tells Angular how to -->
    <!-- identify each item across re-renders so it can reuse/reorder existing DOM instead of rebuilding it. -->
    <!-- [product]="product" is property binding, passing data down into the input.required<Product>() above. -->
    @for (product of products; track product.id) {
      <app-product-card [product]="product" />
    } @empty {
      <!-- @empty renders only when the iterable is empty - no need for a separate *ngIf check. -->
      <div>
        <p>No products founds.</p>
      </div>
    }
  </div>
</div>
