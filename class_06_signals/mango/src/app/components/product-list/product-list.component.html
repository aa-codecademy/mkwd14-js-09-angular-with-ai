<div class="container product-list-page">
  <div class="page-header">
    <h1>All Products</h1>
  </div>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search products</mat-label>
    <!-- (ngModelChange)="" -->
    <!-- [ngModel]="" -->
    <!-- GOTCHA: [(ngModel)] two-way binding desugars to [ngModel]="searchQuery" (ngModelChange)="searchQuery = $event".
    That means on every keystroke it REPLACES the `searchQuery` class field with a plain string, wiping out
    the WritableSignal that lived there - after the first keystroke, searchQuery() below would throw
    "searchQuery is not a function". The safe pattern with signals is [ngModel]="searchQuery()"
    (ngModelChange)="searchQuery.set($event)", or Angular's model() input for two-way signal binding. -->
    <input matInput type="search" , placeholder="Search..." [(ngModel)]="searchQuery" />
  </mat-form-field>

  @if (searchQuery()) {
    <div>Filtering by "{{ searchQuery() }}"</div>
  }

  <div class="products-grid">
    @for (product of filteredProducts(); track product.id) {
      <app-product-card [product]="product" />
    } @empty {
      <div class="empty-state empty-state-full-width">
        <p>No products founds.</p>
      </div>
    }
  </div>
</div>
