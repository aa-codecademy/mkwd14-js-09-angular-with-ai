<div class="container orders-admin-container">
  <div class="orders-admin-header">
    <div>
      <h1 class="page-title">Orders</h1>
      <p class="page-subtitle">Every order placed in the shop.</p>
    </div>
    <a mat-stroked-button routerLink="/admin"><mat-icon>inventory_2</mat-icon>Products</a>
  </div>

  <div class="table-scroll">
    <table
      mat-table
      [dataSource]="store.orders()"
      multiTemplateDataRows
      class="full-width-table"
      matSort
      [matSortActive]="store.sortBy()"
      [matSortDirection]="store.sortDir()"
      matSortDisableClear
      (matSortChange)="onSortChange($event)"
    >
      <ng-container matColumnDef="expand">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let order">
          <button mat-icon-button type="button">
            <mat-icon>expand_more</mat-icon>
          </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Order</th>
        <td mat-cell *matCellDef="let order">#{{ order.id }}</td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Placed</th>
        <td mat-cell *matCellDef="let order">{{ order.createdAt | date: 'medium' }}</td>
      </ng-container>

      <ng-container matColumnDef="customer">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Customer</th>
        <td mat-cell *matCellDef="let order">
          <span class="cell-strong"> {{ order.user.firstName }} {{ order.user.lastName }} </span>
          <span class="cell-muted">{{ order.user.email }}</span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: ['detail']" class="detail-row"></tr>
    </table>
  </div>
</div>
