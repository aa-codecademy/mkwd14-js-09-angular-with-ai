<section class="hero-section">
  <h1 class="hero-title">Welcome to Mango 🥭</h1>
  <p class="hero-subtitle">Premium tech products unbeatable prices.</p>
  <a mat-raised-button color="accent" routerLink="/products">Shop Now</a>
</section>

<section class="container featured-section">
  <h2>Featured Products</h2>

  <div class="products-grid">
    @for (product of featuredProducts(); track product.id) {
      <app-product-card [product]="product" />
    }
  </div>

  <div class="view-all-wrapper">
    <a mat-stroked-button color="primary" routerLink="/products">View All Products</a>
  </div>
</section>
