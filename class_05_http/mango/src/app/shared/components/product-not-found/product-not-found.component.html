<div class="container not-found-page">
  <mat-icon class="not-found-icon">sentiment_dissatisfied</mat-icon>
  <h1 class="not-found-code">404</h1>
  <h2 class="not-found-subtitle">Product Not Found</h2>
  <!-- productId() is called as a function because it's a signal input, not just a plain property. -->
  <p class="not-found-text">
    The product with ID: {{ productId() }} you are looking for does not exist
  </p>
  <a mat-flat-button color="primary" routerLink="/products">Back to Products</a>
</div>
