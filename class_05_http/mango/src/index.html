<!doctype html>
<html lang="en">
  <head>
    <!-- This is the ONE real HTML page of the app - Angular boots into <app-root> below and swaps -->
    <!-- everything inside it as you navigate; there's no full page reload between routes. -->
    <meta charset="utf-8" />
    <title>Mango</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <!-- Angular replaces this custom element with AppComponent's rendered template at bootstrap time -->
    <!-- (see main.ts) - the selector here must match `selector: 'app-root'` in app.component.ts. -->
    <app-root></app-root>
  </body>
</html>
